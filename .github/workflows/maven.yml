name: Java CI with Maven

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Maven local repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Debug: show workspace layout
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          echo "List root contents:"
          ls -la
          echo "List GITHUB_WORKSPACE contents:"
          ls -la "$GITHUB_WORKSPACE" || true
          echo "Search for pom.xml (workspace):"
          find "$GITHUB_WORKSPACE" -maxdepth 6 -name pom.xml || true
          echo "Search for pom.xml (relative):"
          find . -maxdepth 6 -name pom.xml || true

      - name: Build with Maven
        run: |
          # Prefer GITHUB_WORKSPACE, then fallback to find
          if [ -n "$GITHUB_WORKSPACE" ] && [ -f "$GITHUB_WORKSPACE/pom.xml" ]; then
            pom="$GITHUB_WORKSPACE/pom.xml"
          else
            pom=$(find "$GITHUB_WORKSPACE" -maxdepth 6 -name pom.xml 2>/dev/null | head -n 1 || true)
            if [ -z "$pom" ]; then
              pom=$(find . -maxdepth 6 -name pom.xml | head -n 1 || true)
            fi
          fi
          if [ -z "$pom" ]; then
            echo "No pom.xml found in repository"
            exit 1
          fi
          echo "Using POM: $pom"
          mvn -B package --file "$pom"

      - name: Run the Maven verify phase
        run: |
          if [ -n "$GITHUB_WORKSPACE" ] && [ -f "$GITHUB_WORKSPACE/pom.xml" ]; then
            pom="$GITHUB_WORKSPACE/pom.xml"
          else
            pom=$(find "$GITHUB_WORKSPACE" -maxdepth 6 -name pom.xml 2>/dev/null | head -n 1 || true)
            if [ -z "$pom" ]; then
              pom=$(find . -maxdepth 6 -name pom.xml | head -n 1 || true)
            fi
          fi
          if [ -z "$pom" ]; then
            echo "No pom.xml found in repository"
            exit 1
          fi
          echo "Verifying using POM: $pom"
          mvn --batch-mode --update-snapshots verify --file "$pom"

      